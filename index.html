<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><meta name="apple-mobile-web-app-capable" content="yes"><title>MoneyPilot V2</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#f7fbff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}.app{max-width:560px;margin:auto;padding:32px 16px 100px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:26px;font-weight:850}.badge,.muted{color:#8fa4bd;font-size:12px}.badge{padding:7px 10px;background:#13243b;border-radius:99px}.hero,.card{background:#0d1a2b;border:1px solid #1b3049;border-radius:24px;padding:18px;margin:12px 0}.hero{margin-top:20px;background:linear-gradient(145deg,#122944,#0c192a)}.money{font-size:38px;font-weight:850;margin:5px 0}.good{color:#65d6a6;font-size:13px}h2{font-size:18px;margin:24px 2px 10px}.bar{height:9px;background:#17283d;border-radius:99px;overflow:hidden;margin:12px 0}.fill{height:100%;background:#78a9ff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.mini,.chip{background:#101f32;border:1px solid #203a58;border-radius:16px;padding:14px}.mini b{display:block;font-size:17px;margin-top:5px}.chip{color:white;text-align:left;font-weight:750}.chip small{display:block;color:#8fa4bd;margin-top:5px}.primary{width:100%;border:0;border-radius:16px;padding:14px;background:#78a9ff;color:#07111f;font-weight:850;font-size:16px;margin-top:12px}label{display:block;color:#8fa4bd;font-size:12px;margin-top:11px}input,select{width:100%;margin-top:5px;padding:12px;border-radius:12px;border:1px solid #263d58;background:#091523;color:white;font-size:16px}.tab{display:none}.tab.on{display:block}.result{margin-top:14px;padding:14px;background:#091523;border-radius:16px}.big{font-size:28px;font-weight:850}.timeline{border-left:2px solid #29415d;padding-left:16px}.event{margin:17px 0}.event small{display:block;color:#8fa4bd;margin-top:3px}nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:min(calc(100% - 24px),536px);display:grid;grid-template-columns:repeat(4,1fr);background:#0d1928ee;border:1px solid #20334b;border-radius:20px;padding:7px;backdrop-filter:blur(18px)}nav button{border:0;background:transparent;color:#7890aa;padding:8px 2px;border-radius:13px}nav button.sel{background:#162a42;color:white}.note{font-size:11px;color:#71869e;line-height:1.5}
</style></head><body><div class="app"><div class="top"><div class="brand">MoneyPilot</div><div class="badge">財務人生 GPS</div></div>
<section id="home" class="tab on"><div class="hero"><div class="muted">你的預估淨資產</div><div class="money" id="net"></div><div class="good" id="surplus"></div><div style="margin-top:18px"><span class="muted">財務健康度</span> <b id="health"></b><div class="bar"><div class="fill" id="healthbar"></div></div></div></div>
<h2>下一個人生目標</h2><div class="card"><b>🏠 我的第一間房</b><div class="bar"><div class="fill" id="goalbar"></div></div><div class="muted" id="goaltext"></div></div>
<h2>MoneyPilot 建議</h2><div class="card"><b id="advice"></b><p class="muted">重大消費前，先看它會讓人生目標延後多久。</p><button class="primary" onclick="go('afford',1)">✨ 我買得起嗎？</button></div>
<h2>快速模擬</h2><div class="grid"><button class="chip" onclick="car()">🚗 買車<small>月付＋機會成本</small></button><button class="chip" onclick="house()">🏠 買房<small>頭期款＋房貸壓力</small></button><button class="chip" onclick="go('pk',2)">📈 投資<small>未來資產差距</small></button><button class="chip" onclick="go('pk',2)">💳 還債<small>比較利息成本</small></button></div></section>
<section id="afford" class="tab"><h2>我買得起嗎？</h2><div class="card"><label>項目<select id="type"><option>汽車</option><option>房屋</option><option>大型消費</option></select></label><label>價格<input id="price" type="number" value="1200000"></label><label>自備款<input id="down" type="number" value="300000"></label><label>貸款年數<input id="years" type="number" value="5"></label><label>年利率 %<input id="rate" type="number" value="3" step=".1"></label><button class="primary" onclick="calcAfford()">分析這個決定</button><div class="result" id="affordResult">輸入條件後開始分析。</div></div></section>
<section id="pk" class="tab"><h2>人生選擇 PK</h2><div class="card"><label>可運用資金<input id="pkMoney" type="number" value="1000000"></label><label>比較年數<input id="pkYears" type="number" value="5"></label><label>投資年化情境 %<input id="pkReturn" type="number" value="7"></label><label>負債利率 %<input id="pkDebt" type="number" value="4.83"></label><button class="primary" onclick="calcPK()">比較 4 種選擇</button><div class="result" id="pkResult">買車、投資、還債、保留頭期款，一次比較。</div></div></section>
<section id="gps" class="tab"><h2>財務 GPS</h2><div class="card"><div class="timeline" id="timeline"></div></div><h2>我的資料</h2><div class="card"><label>月收入<input id="income" type="number"></label><label>每月支出<input id="expenses" type="number"></label><label>現金<input id="cash" type="number"></label><label>投資資產<input id="investments" type="number"></label><label>負債<input id="debt" type="number"></label><label>頭期款目標<input id="goal" type="number"></label><label>投資年化情境 %<input id="annualReturn" type="number"></label><button class="primary" onclick="save()">儲存並重新規劃</button></div><p class="note">資料只存在這台裝置的瀏覽器。所有預測皆為情境試算，不構成投資、貸款或財務建議。</p></section></div>
<nav><button class="sel" onclick="go('home',0)">⌂<br>首頁</button><button onclick="go('afford',1)">◎<br>買得起嗎</button><button onclick="go('pk',2)">⇄<br>選擇PK</button><button onclick="go('gps',3)">⌖<br>財務GPS</button></nav>
<script>
const fmt=new Intl.NumberFormat('zh-TW',{style:'currency',currency:'TWD',maximumFractionDigits:0}),M=n=>fmt.format(Math.round(n||0));let d=JSON.parse(localStorage.getItem('mpv2')||'null')||{income:68000,expenses:38000,cash:300000,investments:700000,debt:300000,goal:3200000,annualReturn:7};
function S(){return d.income-d.expenses}function go(id,i){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('sel'));document.querySelectorAll('nav button')[i].classList.add('sel');scrollTo(0,0)}
function render(){let s=S(),n=d.cash+d.investments-d.debt,rr=d.income?s/d.income:0,sc=Math.max(20,Math.min(95,55+rr*60-(d.debt>d.income*8?12:0))),p=Math.max(0,Math.min(1,d.cash/d.goal)),mo=s>0?Math.max(0,Math.ceil((d.goal-d.cash)/s)):999;net.textContent=M(n);surplus.textContent=(s>=0?'每月可累積 ':'每月缺口 ')+M(Math.abs(s));health.textContent=Math.round(sc)+'/100';healthbar.style.width=sc+'%';goalbar.style.width=p*100+'%';goaltext.textContent=M(d.cash)+' / '+M(d.goal)+' · '+(mo<999?'約 '+Math.ceil(mo/12)+' 年':'需先改善現金流');advice.textContent=rr>=.3?'現金流目前有能力推進大型目標。':'先提高自由現金流，再承擔大型消費。';timeline.innerHTML='<div class="event"><b>現在｜'+M(n)+'</b><small>每月自由現金流 '+M(s)+'</small></div><div class="event"><b>第一站｜緊急預備金</b><small>約 '+M(d.expenses*6)+'</small></div><div class="event"><b>第二站｜頭期款 '+M(d.goal)+'</b><small>'+(mo<999?'目前速度約 '+Math.ceil(mo/12)+' 年':'需要改善現金流')+'</small></div><div class="event"><b>長期｜資產成長</b><small>年化 '+d.annualReturn+'% 僅為情境假設</small></div>';['income','expenses','cash','investments','debt','goal','annualReturn'].forEach(k=>document.getElementById(k).value=d[k])}
function save(){['income','expenses','cash','investments','debt','goal','annualReturn'].forEach(k=>d[k]=+document.getElementById(k).value||0);localStorage.setItem('mpv2',JSON.stringify(d));render();go('home',0)}
function pmt(P,a,y){let r=a/1200,N=y*12;return r?P*r*Math.pow(1+r,N)/(Math.pow(1+r,N)-1):P/N}
function calcAfford(){let P=Math.max(0,+price.value-(+down.value)),pay=pmt(P,+rate.value,+years.value),after=S()-pay,score=Math.max(0,Math.min(100,100-pay/Math.max(d.income,1)*120-(+down.value/Math.max(d.cash,1))*20)),r=d.annualReturn/1200,N=60,lost=(+down.value)*Math.pow(1+d.annualReturn/100,5)+(r?pay*(Math.pow(1+r,N)-1)/r:pay*N);affordResult.innerHTML='<div class="big">'+Math.round(score)+'/100</div><div class="muted">負擔能力分數（原型）</div><div class="grid" style="margin-top:12px"><div class="mini">月付<b>'+M(pay)+'</b></div><div class="mini">買後月餘額<b>'+M(after)+'</b></div><div class="mini">5年機會成本<b>'+M(lost)+'</b></div><div class="mini">現金流占比<b>'+Math.round(pay/Math.max(d.income,1)*100)+'%</b></div></div>'}
function calcPK(){let x=+pkMoney.value,y=+pkYears.value,r=+pkReturn.value/100,dr=+pkDebt.value/100,iv=x*Math.pow(1+r,y),sv=x*Math.pow(1+dr,y)-x;pkResult.innerHTML='<div class="grid"><div class="mini">🚗 消費<b>'+M(0)+'</b></div><div class="mini">📈 投資<b>'+M(iv)+'</b></div><div class="mini">💳 還債省息<b>'+M(sv)+'</b></div><div class="mini">🏠 保留頭期<b>'+M(x)+'</b></div></div><p class="note">簡化情境比較，未計稅、折舊、風險與交易成本。</p>'}
function car(){go('afford',1);type.value='汽車';price.value=1200000;down.value=300000;years.value=5;rate.value=3}function house(){go('afford',1);type.value='房屋';price.value=16000000;down.value=3200000;years.value=30;rate.value=2.5}render();
</script></body></html>
